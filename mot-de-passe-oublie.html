<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#490009">
  <meta name="description" content="Réinitialisation du mot de passe — Jade Clean.">
  <title>Mot de passe oublié</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/connexion.css">
</head>

<body>

  <main class="page-connexion">
    <div class="vitrine">
      <div>
        <a href="index.html">
          <img src="jadeclean-logo.webp" alt="Jade Clean" class="logo">
        </a>
      </div>

      <div class="mt-auto mb-4">
        <h1>
          et votre Espace <span class="accent">devient Beauté</span>
        </h1>
        <p class="description">
          L'excellence discrète au service des palaces, hôtels 5 étoiles et maisons de caractère.
        </p>
      </div>

      <div class="copyright">
        &copy; 2026 JADE CLEAN
      </div>
    </div>

    <div class="panneau-formulaire">
      <div class="contenu">

        <h2>MOT DE PASSE OUBLIÉ ?</h2>
        <p class="sous-titre">Réinitialisez votre mot de passe ici</p>

        <div class="carte-connexion">
          <form id="resetPasswordForm">
            <div class="mb-3">
              <label for="new_password">Nouveau mot de passe</label>
              <div class="champ-icone">
                <i class="bi bi-lock"></i>
                <input type="password" id="new_password" autocomplete="new-password" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirm_password">Confirmer mot de passe</label>
              <div class="champ-icone">
                <i class="bi bi-lock"></i>
                <input type="password" id="confirm_password" autocomplete="new-password" required>
              </div>
            </div>

            <div id="resetSuccess" class="auth-message succes">
              Mot de passe réinitialisé ! Redirection en cours…
            </div>
            <div id="resetError" class="auth-message erreur"></div>

            <button type="submit" id="resetBtn" class="bouton-validation">
              Réinitialisez mot de passe
            </button>
          </form>
        </div>

        <div class="pied-formulaire">
          Vous avez un compte ? <a href="connexion.html">Connectez vous ici</a>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
