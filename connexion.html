<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Jade Clean</title>
    
    <!-- Balises Meta SEO -->
    <meta name="description" content="Espace de connexion sécurisé pour les hôtels et le personnel de Jade Clean.">
    <meta property="og:title" content="Connexion - Jade Clean">
    <meta property="og:description" content="L'excellence discrète au service des palaces et hôtels 5 étoiles.">
    <meta property="og:type" content="website">
    
    <!-- Polices Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <script src="js/connexion.js" defer></script>
</head>

<body class="page-connexion">
    
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <!-- Toggle Thème -->
    <label class="theme-switch" id="themeToggle" title="Changer de thème">
        <input type="checkbox" id="themeCheckbox" aria-label="Changer de thème">
        <span class="switch-track">
            <span class="icon-moon">
                <img src="images/icons-lune.png" alt="Mode sombre" class="theme-icon-img" onerror="this.onerror=null; this.src='images/icons-lune.svg';">
            </span>
            <span class="icon-sun">
                <img src="images/icons-soleil.png" alt="Mode clair" class="theme-icon-img" onerror="this.onerror=null; this.src='images/icons-soleil.svg';">
            </span>
            <span class="switch-thumb"></span>
        </span>
    </label>

    <main class="connexion-layout">
        
        <!-- Section Gauche : Visuel & Slogan -->
        <section class="connexion-branding">
            <div class="branding-header">
                <a href="index.html" class="branding-logo-link">
                    <img src="images/JADECLEAN_logo_transparent.svg" alt="Jade Clean" class="brand-logo">
                </a>
            </div>
            
            <div class="branding-content">
                <h1 class="brand-slogan">et votre Espace <span>devient Beauté</span></h1>
                <p class="brand-description">
                    Dans le milieu du Luxe la propreté des lieux n'est surtout pas un détail, mais la priorité absolue.
                </p>
            </div>

            <div class="branding-footer">
                <p>&copy; 2026 JADE CLEAN</p>
            </div>
        </section>

        <!-- Section Droite : Formulaire de Connexion -->
        <section class="connexion-form-container">
            <div class="login-box">
                <!-- Icône d'en-tête -->
                <div class="login-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </div>

                <h2 class="login-title">Bon retour</h2>
                <p class="login-subtitle">Connectez-vous à votre espace</p>

                <!-- Carte de Formulaire -->
                <div class="form-card">

                    <!-- Sélecteur de rôle Client / Interne -->
                    <div class="role-toggle">
                        <button type="button" class="role-btn active" id="btnClient">Client</button>
                        <button type="button" class="role-btn" id="btnInterne">Interne</button>
                    </div>

                    <!-- Formulaire principal -->
                    <form id="loginForm">
                        <div class="input-field">
                            <label for="email">Email</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                                <input type="email" id="email" autocomplete="username" required placeholder="nom@hotel.com">
                            </div>
                        </div>

                        <div class="input-field input-field-last">
                            <div class="label-row">
                                <label for="password">Mot de passe</label>
                                <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                            </div>
                            
                            <div class="input-wrapper">
                                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
                                <button type="button" id="togglePassword" class="toggle-password" aria-label="Afficher le mot de passe" title="Afficher / Masquer le mot de passe">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-submit">Se connecter</button>
                    </form>
                </div>

                <p class="signup-text">
                    Pas encore de compte ? <a href="contact.html">Créer un compte</a>
                </p>
                <p class="back-home">
                    <a href="index.html">← Retour à l'accueil</a>
                </p>
            </div>
        </section>
    </main>

    <!-- Bouton flottant mobile (conservé pour compatibilité JS) -->
    <button type="button" class="mobile-theme-fab" id="mobileThemeFab" title="Changer de thème" aria-label="Changer de thème">
        <span class="mini-toggle-track">
            <span class="mini-icon-moon">
                <img src="images/icons-lune.png" alt="Mode sombre" class="theme-icon-img" onerror="this.onerror=null; this.src='images/icons-lune.svg';">
            </span>
            <span class="mini-icon-sun">
                <img src="images/icons-soleil.png" alt="Mode clair" class="theme-icon-img" onerror="this.onerror=null; this.src='images/icons-soleil.svg';">
            </span>
            <span class="mini-toggle-thumb"></span>
        </span>
    </button>
</body>
</html>
